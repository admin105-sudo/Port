<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Abinaya P | Cloud &amp; DevOps Engineer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,700;0,800;1,800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#05070f;--bg2:#0b1530;--ink:#eef3ff;--mute:#a3afcc;--gold:#e62429;--rose:#3d8bff;--line:rgba(47,123,255,.22);--card:rgba(255,255,255,.04);
--d:'Barlow Condensed','Arial Narrow',sans-serif;--b:'DM Sans','Segoe UI',sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#f3f6fd;--bg2:#e3ebfa;--ink:#0a1020;--mute:#44506b;--gold:#c4161c;--rose:#1f5fd6;--line:rgba(10,16,32,.16);--card:rgba(255,255,255,.75)}
:root[data-theme="dark"]{--bg:#05070f;--bg2:#0b1530;--ink:#eef3ff;--mute:#a3afcc;--gold:#e62429;--rose:#3d8bff;--line:rgba(47,123,255,.22);--card:rgba(255,255,255,.04)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(80px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.65 var(--b);overflow-x:hidden;transition:background .4s,color .4s}
a{color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:6px}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}
#prog{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--gold),var(--rose));box-shadow:0 0 12px var(--gold),0 0 24px var(--rose);z-index:60}
#glow{position:fixed;width:440px;height:440px;margin:-220px 0 0 -220px;border-radius:50%;background:radial-gradient(circle,rgba(61,139,255,.18),rgba(230,36,41,.08) 45%,transparent 70%);opacity:.85;pointer-events:none;z-index:0;left:50%;top:30%;transition:opacity .3s,transform .15s ease-out}
nav{position:fixed;top:0;left:0;right:0;z-index:50;padding:calc(12px + env(safe-area-inset-top,0px)) 0 12px;backdrop-filter:blur(14px);background:color-mix(in srgb,var(--bg) 70%,transparent);border-bottom:1px solid var(--line);transition:padding .3s,background .3s,box-shadow .3s}
nav.sm{padding-top:calc(6px + env(safe-area-inset-top,0px));padding-bottom:6px;box-shadow:0 8px 30px rgba(0,0,0,.35)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font:800 22px var(--d);text-decoration:none;letter-spacing:.02em;background:linear-gradient(120deg,var(--ink),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;transition:transform .3s}
.logo:hover{transform:scale(1.05)}
.links{display:flex;gap:22px;align-items:center}
.links a{text-decoration:none;color:var(--mute);font-size:15px;position:relative;transition:color .25s}
.links a::after{content:"";position:absolute;left:0;bottom:-4px;height:2px;width:100%;background:var(--gold);transform:scaleX(0);transform-origin:left;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.links a:hover{color:var(--ink)}.links a:hover::after{transform:scaleX(1)}
#theme{background:none;border:1px solid var(--line);color:var(--ink);width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:16px;transition:transform .4s,border-color .3s}
#theme:hover{transform:rotate(180deg);border-color:var(--gold)}
section{position:relative;z-index:1;padding:96px 0}
h2{font:800 clamp(30px,5vw,46px)/1.1 var(--d);margin:0 0 36px;letter-spacing:0;font-style:italic;text-transform:uppercase}
.hero{min-height:100vh;min-height:100svh;display:flex;align-items:center;padding-top:110px;overflow:hidden;position:relative}
.hero .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center;position:relative;z-index:2}
.blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.32;animation:float 14s ease-in-out infinite;z-index:0}
.b1{width:360px;height:360px;background:var(--gold);right:-80px;top:10%}
.b2{width:320px;height:320px;background:var(--rose);left:-100px;bottom:5%;animation-delay:-6s}
@keyframes float{50%{transform:translate(35px,-45px) scale(1.14)}}
.role{color:var(--gold);font-weight:600;margin:0 0 14px;display:flex;align-items:center;gap:12px;font-size:16px;letter-spacing:.05em;text-transform:uppercase}
